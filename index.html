<style>
/* Layout: plan-sheet workspace. Side rail (bottom bar on phones), ruled sheet cards, tape-measure ticks on every grand total. */
:root{
  --bg:#E9EDEF; --surface:#F7F9FA; --surface2:#E1E7EA; --field:#FFFFFF;
  --ink:#14202B; --ink2:#51606B; --line:#C5CED4;
  --primary:#14202B; --primary-ink:#F7F9FA;
  --accent:#F2B705; --accent-ink:#14202B;
  --focus:#1B5FD1; --danger:#B3261E; --danger-bg:#B3261E; --on-danger:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#14202B; --paper-mute:#5A6772; --paper-line:#D5DCE0;
  --display:'Barlow Condensed','IBM Plex Sans Arabic','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Arabic',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16202A; --surface2:#1F2B36; --field:#0E151B;
  --ink:#E6ECEF; --ink2:#93A1AC; --line:#2B3946;
  --primary:#E6ECEF; --primary-ink:#0E151B; --accent:#F2B705; --accent-ink:#14202B;
  --focus:#6CA8FF; --danger:#F2857D; --danger-bg:#F2857D; --on-danger:#1A0B0A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --surface2:#1F2B36; --field:#0E151B;
  --ink:#E6ECEF; --ink2:#93A1AC; --line:#2B3946;
  --primary:#E6ECEF; --primary-ink:#0E151B; --accent:#F2B705; --accent-ink:#14202B;
  --focus:#6CA8FF; --danger:#F2857D; --danger-bg:#F2857D; --on-danger:#1A0B0A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:16px 48px}
.nav{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 12px 14px}
.brand b{display:block;font:700 34px/1 var(--display);letter-spacing:.01em}
.brand span{display:block;color:var(--ink2);font-size:12px;margin-top:4px}
.tape{height:12px;color:var(--ink);background-image:linear-gradient(90deg,currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px);background-size:30px 12px,6px 6px;background-repeat:repeat-x;background-position:0 100%}
.brand .tape{margin-top:10px;width:100%}
.nbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:transparent;color:var(--ink2);font-weight:500;border-radius:5px;cursor:pointer;text-align:start}
.nbtn:hover{background:var(--surface2);color:var(--ink)}
.nbtn[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}
.nbtn svg,.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font:600 34px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink2);padding:7px 11px;font-weight:600;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:16px}
.btn{border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);padding:9px 14px;border-radius:5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.armed{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--on-danger)}
.icon{border:1px solid var(--line);background:var(--field);color:var(--ink);width:36px;height:38px;border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icon:hover{border-color:var(--ink2)}

label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl,label.f>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
input,select,textarea{color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input.num{font-family:var(--mono);text-align:end}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px}
.pcard h3{font:600 24px/1.1 var(--display);text-wrap:balance}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--ink2)}
.pill.inv{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.big{font:600 28px/1 var(--display);font-variant-numeric:tabular-nums}

.phead{display:flex;flex-direction:column;gap:14px;padding:16px}
.gt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.gt .big{font-size:38px}
.floor{overflow:hidden}
.fhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.fhead input.title{font:600 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;border-color:transparent;background:transparent;flex:1 1 160px;padding:4px 6px}
.fhead input.title:hover,.fhead input.title:focus{border-color:var(--line);background:var(--field)}
.sub{font:600 20px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rooms{display:flex;flex-direction:column;gap:14px;padding:14px}
.room{border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 12px}
.rhead input.title{font-weight:600;font-size:16px;border-color:transparent;background:transparent;flex:1 1 140px;padding:4px 6px}
.rhead input.title:hover,.rhead input.title:focus{border-color:var(--line);background:var(--field)}
.linehead,.line{display:grid;grid-template-columns:minmax(0,1fr) 132px 96px 116px 124px 36px;gap:8px;align-items:end}
.linehead{padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border-top:1px solid var(--line)}
.linehead span:nth-child(4),.linehead span:nth-child(5){text-align:end}
.line{padding:8px 12px;border-top:1px solid var(--line)}
.line .lbl{display:none}
.qtybox{display:flex;gap:4px}
.c-tot{text-align:end;font-weight:600;padding-block:9px;white-space:nowrap}
.empty{padding:16px 12px;color:var(--ink2);border-top:1px solid var(--line)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.pickpanel{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.picklist{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.pick{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:start;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 12px;cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--surface2)}
.pick .mono{font-size:13px;white-space:nowrap}
.floorfoot{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}

.totals{align-self:flex-end;width:min(440px,100%);display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:1fr 96px 140px;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.trow .v{text-align:end;font-family:var(--mono);font-variant-numeric:tabular-nums}
.trow input{padding:5px 8px}
.grand{background:var(--accent);color:var(--accent-ink);border-bottom:0;padding:14px 16px}
.grand .v{font:700 26px var(--display)}
.grand span:first-child{font:600 20px var(--display);text-transform:uppercase;letter-spacing:.04em}
.totals .tape{color:var(--accent-ink);background-color:var(--accent)}

.crow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 92px 130px 36px;gap:8px;align-items:end;padding:8px 12px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow label.f>span{display:none}
.chead{padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:32px;max-width:900px;width:100%}
.sheet h2{font:700 40px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.sheet .mute{color:var(--paper-mute)}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px}
.shead>div{min-width:0}
.sheet .tape{color:var(--paper-ink);margin-block:16px 12px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin-top:8px}
.meta dt{color:var(--paper-mute)}.meta dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pre{white-space:pre-line}
.twrap{overflow-x:auto;margin-top:18px}
table.inv{width:100%;border-collapse:collapse;min-width:640px;table-layout:auto}
table.inv th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-mute);text-align:start;padding:6px 8px;border-bottom:2px solid var(--paper-ink)}
table.inv td{padding:6px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top}
table.inv .r{direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-inline:10px}
table.inv th.r{font-family:var(--body)}
table.inv td.u{white-space:nowrap;width:1%;padding-inline:10px}
table.inv td:first-child{min-width:170px}
table.inv tr.fl td{font:600 20px var(--display);text-transform:uppercase;letter-spacing:.03em;padding-top:16px;border-bottom:2px solid var(--paper-ink)}
table.inv tr.rm td{font-weight:600;background:#EEF2F4;color:#14202B}
table.inv tr.st td{font-weight:600}
table.inv tr.fs td{font-weight:700;border-bottom:2px solid var(--paper-ink)}
.itotals{margin-inline-start:auto;width:min(360px,100%);margin-top:14px}
.itotals div{display:flex;justify-content:space-between;gap:16px;padding:5px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.itotals div span:last-child{direction:ltr;unicode-bidi:isolate;text-align:right;white-space:nowrap}
.itotals div span:first-child{font-family:var(--body)}
.sub,.big,.trow .v,.c-tot .mono,.pick .mono,.pcard .big,.result b{direction:ltr;unicode-bidi:isolate}
.itotals .g{background:#F2B705;color:#14202B;font:700 24px var(--display);padding:10px 8px;margin-top:6px}
.terms{margin-top:22px;font-size:13px;color:var(--paper-mute)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.62);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(520px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel h2{font:600 28px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.result{background:var(--accent);color:var(--accent-ink);padding:12px 14px;border-radius:4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.result b{font:700 36px/1 var(--display);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--ink2)}
.banner{border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:5px;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--primary-ink);padding:9px 16px;border-radius:5px;z-index:60;font-weight:600}
.sect{display:flex;flex-direction:column;gap:12px;padding:16px}
.sect h3{font:600 22px var(--display);text-transform:uppercase;letter-spacing:.03em}

[dir="rtl"] *{letter-spacing:0!important}
[dir="rtl"] .topbar h1,[dir="rtl"] .fhead input.title,[dir="rtl"] .sheet h2,[dir="rtl"] .sect h3,[dir="rtl"] .panel h2,[dir="rtl"] table.inv tr.fl td,[dir="rtl"] .lbl,[dir="rtl"] label.f>span,[dir="rtl"] .linehead,[dir="rtl"] .chead,[dir="rtl"] .pill,[dir="rtl"] table.inv th,[dir="rtl"] .grand span:first-child{text-transform:none}
[dir="rtl"] .topbar h1,[dir="rtl"] .fhead input.title{font-weight:700}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:96px}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;gap:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .brand{display:none}
  .nbtn{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;align-items:center;text-align:center;min-width:0}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .topbar h1{font-size:28px}
}
@media (max-width:700px){
  .linehead{display:none}
  .line{grid-template-columns:repeat(3,minmax(0,1fr)) 36px;gap:8px 8px}
  .line .lbl{display:block}
  .c-desc{grid-column:1/4}.c-del{grid-column:4;grid-row:1}
  .c-qty{grid-column:1}.c-unit{grid-column:2}.c-rate{grid-column:3}
  .c-tot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-block:6px 0}
  .crow{grid-template-columns:repeat(3,minmax(0,1fr)) 36px}
  .crow label.f>span{display:block}
  .crow .cn{grid-column:1/4}.crow .cd{grid-column:4;grid-row:1}
  .chead{display:none}
  .trow{grid-template-columns:1fr 84px 1fr}
  .sheet{padding:18px}
  .gt{align-items:flex-start}
}
@media print{
  .nav,.topbar,.noprint,.toast,.modal{display:none!important}
  body{background:#fff;padding:0}
  .shell{display:block;padding:0}
  .sheet{border:0;padding:0;max-width:none}
  .itotals .g,table.inv tr.rm td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

(function(){

const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const r3=x=>Math.round((x+Number.EPSILON)*1000)/1000;
function pn(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  const s=String(v==null?'':v).replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x660)).replace(/٫/g,'.').replace(/٬/g,'').replace(',','.').replace(/[^0-9.\-]/g,'');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
function compute(p){
  let sub=0;
  const floors=p.floors.map(f=>{
    let fs=0;
    const rooms=f.rooms.map(r=>{
      let rs=0;
      const items=r.items.map(i=>{const t=r2(pn(i.qty)*pn(i.rate));rs+=t;return t;});
      rs=r2(rs);fs+=rs;return {id:r.id,sub:rs,items};
    });
    fs=r2(fs);sub+=fs;return {id:f.id,sub:fs,rooms};
  });
  sub=r2(sub);
  const disc=r2(sub*pn(p.discount)/100), net=r2(sub-disc);
  return {floors,sub,disc,net,tax:0,grand:net};
}
const CALC={
  rect:{u:'m2',f:v=>pn(v.l)*pn(v.w)},
  walls:{u:'m2',f:v=>Math.max(0,2*(pn(v.l)+pn(v.w))*pn(v.h)-pn(v.o))},
  circle:{u:'m2',f:v=>Math.PI*Math.pow(pn(v.d)/2,2)},
  circ:{u:'ml',f:v=>Math.PI*pn(v.d)},
  tri:{u:'m2',f:v=>pn(v.b)*pn(v.h)/2},
  perim:{u:'ml',f:v=>2*(pn(v.l)+pn(v.w))},
  seg:{u:'ml',f:v=>String(v.s||'').split(/[+;\s]+/).reduce((a,x)=>a+pn(x),0)},
  vol:{u:'m3',f:v=>pn(v.l)*pn(v.w)*pn(v.h)}
};
const CALC_FIELDS={rect:['l','w'],walls:['l','w','h','o'],circle:['d'],circ:['d'],tri:['b','h'],perim:['l','w'],seg:['s'],vol:['l','w','h']};
function calcResult(mode,v,waste,count){
  const c=CALC[mode];const n=pn(count)>0?pn(count):1;
  return {unit:c.u,value:r3(c.f(v||{})*n*(1+Math.max(0,pn(waste))/100))};
}

function fmtDate(s){try{return new Intl.DateTimeFormat(loc(),{dateStyle:'medium'}).format(new Date(s+'T00:00:00'))}catch(e){return s}}
function h(tag,a,...kids){
  const e=document.createElement(tag);let val;
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')val=v;
    else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  if(val!==undefined)e.value=val;
  return e;
}

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('metre-db',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('catalog',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
})}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const tr=db.transaction(store,mode);const out=fn(tr.objectStore(store));
  tr.oncomplete=()=>res(out&&'result' in out?out.result:undefined);tr.onerror=()=>rej(tr.error);tr.onabort=()=>rej(tr.error);
})}
const dbAll=s=>tx(s,'readonly',st=>st.getAll());
function dbFail(e){console.error(e);S.dbOk=false;render(true)}
const dbPut=(s,o)=>S.dbOk&&db?tx(s,'readwrite',st=>st.put(o)).catch(dbFail):Promise.resolve();
const dbDel=(s,id)=>S.dbOk&&db?tx(s,'readwrite',st=>st.delete(id)).catch(dbFail):Promise.resolve();
const dbClear=s=>S.dbOk&&db?tx(s,'readwrite',st=>st.clear()).catch(dbFail):Promise.resolve();
const timers={};
function later(key,fn){clearTimeout(timers[key]);timers[key]=setTimeout(fn,300)}
const touch=p=>{p.updated=Date.now();later('p'+p.id,()=>dbPut('projects',JSON.parse(JSON.stringify(p))))};

const saveSettings=()=>dbPut('meta',{key:'settings',value:JSON.parse(JSON.stringify(S.settings))});

  });
  L.push(t('subtotal')+': '+money(c.sub));
  if(pn(p.discount))L.push(t('discount')+' '+pn(p.discount)+'%: -'+money(c.disc));
  L.push(t('grand')+': '+money(c.grand));
  return L.join('\n');
}

/* ---------- settings ---------- */
function viewSettings(){
  const st=S.settings;
  const paste=h('textarea',{id:'pastebox','aria-label':t('import_paste'),placeholder:t('import_paste')});
  return h('div',{class:'main'},
    h('div',{class:'card sect'},h('h3',{},t('business')),
      h('div',{class:'grid'},
        field(t('business_name'),h('input',{type:'text',value:st.business,oninput:e=>{st.business=e.target.value;saveSettings()}})),
        field(t('business_info'),h('textarea',{oninput:e=>{st.info=e.target.value;saveSettings()}},st.info||''))),
      field(t('terms'),h('textarea',{oninput:e=>{st.terms=e.target.value;saveSettings()}},st.terms||''))),
    h('div',{class:'card sect'},h('h3',{},t('currency')+' · '+t('language')),
      h('div',{class:'grid'},
        field(t('currency'),h('select',{value:st.currency,onchange:e=>{st.currency=e.target.value;saveSettings();render(true)}},...CURRENCIES.map(c=>h('option',{value:c},c)))),
        field(t('language'),h('select',{value:S.lang,onchange:e=>{S.lang=e.target.value;st.lang=S.lang;saveSettings();render(true)}},h('option',{value:'en'},'English'),h('option',{value:'fr'},'Français'),h('option',{value:'ar'},'العربية'))),
        field(t('theme'),h('select',{value:st.theme,onchange:e=>{st.theme=e.target.value;saveSettings();render(true)}},h('option',{value:'auto'},t('theme_auto')),h('option',{value:'light'},t('theme_light')),h('option',{value:'dark'},t('theme_dark'))))),
      h('p',{class:'hint'},t('currency_hint'))),
    h('div',{class:'card sect'},h('h3',{},t('backup')),h('p',{class:'hint'},t('backup_hint')),
      h('div',{class:'row'},
        h('button',{class:'btn',type:'button',onclick:exportData},t('export_json')),
        h('label',{class:'btn ghost',style:'cursor:pointer'},t('import_json'),h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:async e=>{const f=e.target.files[0];if(f)importData(await f.text())}})),
        confirmBtn('btn danger',t('reset'),resetAll)),
      FRAMED?h('div',{class:'row'},h('div',{style:'flex:1 1 260px'},paste),h('button',{class:'btn ghost',type:'button',onclick:()=>importData(paste.value)},t('import_btn'))):null));
}
function snapshot(){return JSON.stringify({app:'metre',v:1,settings:S.settings,catalog:S.catalog,projects:S.projects})}
async function exportData(){
  const data=snapshot();
  if(FRAMED){toast(await copyText(data)?t('export_copied'):'—');return}
  const a=h('a',{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:'metre-backup-'+today()+'.json'});
  document.body.append(a);a.click();a.remove();
}
async function importData(txt){
  try{
    const d=JSON.parse(txt);if(!d||d.app!=='metre'||!Array.isArray(d.projects)||!Array.isArray(d.catalog))throw new Error('bad');
    await dbClear('projects');await dbClear('catalog');
    S.projects=d.projects;S.catalog=d.catalog;
    if(d.settings)S.settings=Object.assign(S.settings,d.settings);
    await Promise.all([...S.projects.map(p=>dbPut('projects',p)),...S.catalog.map(s=>dbPut('catalog',s)),saveSettings()]);
    S.lang=S.settings.lang||S.lang;S.cur=S.projects[0]?S.projects[0].id:null;S.view='projects';render(false);toast(t('import_ok'));
  }catch(e){toast(t('import_err'))}
}
async function resetAll(){
  await Promise.all([dbClear('projects'),dbClear('catalog')]);
  S.catalog=seedCatalog();const sp=seedProject(S.lang);S.projects=[sp];S.cur=sp.id;
  await Promise.all([...S.catalog.map(s=>dbPut('catalog',s)),dbPut('projects',sp)]);
  S.view='projects';render(false);
}

/* ---------- init ---------- */
async function init(){
  const nav=(navigator.language||'en').slice(0,2);
  const defaults={lang:I18N[nav]?nav:'en',theme:'auto',currency:'DZD',tax:0,business:'',info:'',terms:I18N[I18N[nav]?nav:'en'].terms_default,last:null};
  S.settings=Object.assign({},defaults);
  try{db=await openDB()}catch(e){S.dbOk=false}
  let seeded=false;
  if(S.dbOk){
    try{
      const meta=await dbAll('meta');const m=meta.find(x=>x.key==='settings');
      if(m)Object.assign(S.settings,m.value);
      S.catalog=await dbAll('catalog');S.projects=await dbAll('projects');
      seeded=!!m;
      const old=S.catalog.find(s=>s.id==='s-day');
      if(old&&old.unit==='day'&&old.rate===3500){
        const nw=SEED.find(x=>x.id==='s-day');
        old.unit='h';old.rate=nw.rate;old.names=Object.assign({},nw.n);await dbPut('catalog',old);
      }
      if(m&&!S.settings.dailyAdded){
        S.settings.dailyAdded=true;
        if(!S.catalog.some(s=>s.id==='s-daily')){
          const dd=SEED.find(x=>x.id==='s-daily');
          const ns={id:dd.id,names:Object.assign({},dd.n),unit:dd.u,rate:dd.rate,cat:dd.cat};
          S.catalog.push(ns);await dbPut('catalog',ns);
        }
        await saveSettings();
      }
    }catch(e){S.dbOk=false}
  }
  S.lang=S.settings.lang;
  if(!seeded){
    S.catalog=seedCatalog();const sp=seedProject(S.lang);S.projects=[sp];
    if(S.dbOk)await Promise.all([...S.catalog.map(s=>dbPut('catalog',s)),dbPut('projects',sp),saveSettings()]);
  }
  const last=S.projects.find(p=>p.id===S.settings.last);
  S.cur=last?last.id:(S.projects[0]?S.projects[0].id:null);
  S.view=S.cur?'estimate':'projects';
  render(false);
}
init();
})();
</script>
